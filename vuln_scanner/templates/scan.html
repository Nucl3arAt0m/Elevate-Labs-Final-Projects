<!DOCTYPE html>
<html>
<head>
    <title>Web Vulnerability Scanner</title>
    <style>
        table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        form { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Web Application Vulnerability Scanner</h1>
    <form method="POST">
        <label>Enter Target URL:</label>
        <input type="text" name="url" placeholder="http://example.com" required>
        <input type="submit" value="Scan">
    </form>
    <a href="/download_log">Download Vulnerability Log</a>
    {% if results %}
    <h2>Scan Results</h2>
    <table>
        <tr>
            <th>Type</th>
            <th>URL</th>
            <th>Payload</th>
            <th>Severity</th>
            <th>Evidence</th>
        </tr>
        {% for vuln in results %}
        <tr>
            <td>{{ vuln['type'] }}</td>
            <td>{{ vuln['url'] }}</td>
            <td>{{ vuln['payload'] }}</td>
            <td>{{ vuln['severity'] }}</td>
            <td>{{ vuln['evidence'] }}</td>
        </tr>
        {% endfor %}
    </table>
    {% endif %}
</body>
</html>
